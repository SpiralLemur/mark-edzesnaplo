<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mark Edzésnapló"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-512.png"><link rel="manifest" href="manifest.webmanifest"><title>Mark Edzésnapló V6</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#172033;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f172a,#21445a);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.head{display:flex;gap:12px;align-items:center}.head img{width:52px;height:52px;border-radius:13px}h1{font-size:23px;margin:0}.wrap{max-width:1100px;margin:auto;padding:12px}.nav,.days,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.nav{overflow:auto;flex-wrap:nowrap;margin-bottom:10px}.nav button,.days button,button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.nav button,.days button{background:#fff;white-space:nowrap}.active,.primary{background:#0f766e!important;color:#fff}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.exercise{display:grid;grid-template-columns:105px 78px 1fr;gap:10px;content-visibility:auto;contain-intrinsic-size:150px}.machine,.muscle{width:100%;height:108px;object-fit:contain;border-radius:11px}.machine{background:#f8fafc}.muscle{background:#fff5f5;border:1px solid #fecaca}.done{background:#ecfdf5}.done h3{text-decoration:line-through;color:#166534}.check{width:25px;height:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.month{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.muted,label{color:#64748b;font-size:13px}.metric{font-size:26px;font-weight:800}.progress{height:13px;background:#dbe4e8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#22c55e}.last{margin:7px 0;padding:7px;background:#eff6ff;border-radius:8px;font-size:12px}.warning{color:#991b1b;font-weight:700}.good{color:#15803d}.bad{color:#b91c1c}input,select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.chart{width:100%;height:230px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}.danger{background:#fee2e2;color:#991b1b}.version{font-size:11px;color:#a7f3d0}@media(max-width:700px){.exercise{grid-template-columns:75px 56px 1fr}.machine,.muscle{height:84px}.stats,.month{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}</style></head><body><header><div class="head"><img src="icons/icon-180.png" width="52" height="52"><div><h1>Mark Edzésnapló</h1><div style="color:#cad5dd">Biostrength edzés, fejlődés és testméretek</div><div class="version">V6 frissített edzésterv</div></div></div></header><div class="wrap"><div class="nav" id="nav"></div><main id="app"></main></div><script>
const D={"plans":{"Hétfő":[["Lat Machine","3","10",""],["Low Row","3","10","50"],["Chest Press","3","10","45"],["Shoulder Press","3","10-12","12"],["Total Abdominal","3","15-20","41"],["Lower Back","3","15","35"],["Leg Press","3","12",""],["Leg Curl","3","12",""],["Run Excite séta","10-15 perc","4,5 km/h","6-7%"]],"Szerda":[["Lat Machine","3","10",""],["Low Row","3","10","50"],["Chest Press","3","10","45"],["Shoulder Press","3","10-12","12"],["Total Abdominal","3","15-20","41"],["Lower Back","3","15","35"],["Leg Extension","3","12",""],["Leg Curl","3","12",""],["Run Excite séta","10-15 perc","4,5 km/h","6-7%"]],"Péntek":[["Lat Machine","3","10",""],["Low Row","3","10","50"],["Chest Press","3","10","45"],["Shoulder Press","3","10-12","12"],["Total Abdominal","3","15-20","41"],["Lower Back","3","15","35"],["Leg Press","3","12",""],["Leg Curl / Leg Extension","3","12",""],["Run Excite séta","35 perc","4,5 km/h","7%"]]},"imgs":{"Chest Press":"images/machines/chest-press.webp","Vertical Traction":"images/machines/vertical-traction.webp","Low Row":"images/machines/low-row.webp","Shoulder Press":"images/machines/shoulder-press.webp","Arm Adduction / Pectoral":"images/machines/arm-adduction.webp","Leg Curl":"images/machines/leg-curl.webp","Leg Press":"images/machines/leg-press.webp","Total Abdominal":"images/machines/total-abdominal.webp","Lower Back":"images/machines/lower-back.webp","Lat Machine":"images/machines/lat-machine.webp","Run Excite séta":"images/machines/run-excite.webp","Leg Extension":"images/machines/leg-curl.webp","Leg Curl / Leg Extension":"images/machines/leg-curl.webp"},"mus":{"Chest Press":"images/muscles/chest-press.webp","Vertical Traction":"images/muscles/vertical-traction.webp","Low Row":"images/muscles/low-row.webp","Shoulder Press":"images/muscles/shoulder-press.webp","Arm Adduction / Pectoral":"images/muscles/arm-adduction.webp","Leg Curl":"images/muscles/leg-curl.webp","Leg Press":"images/muscles/leg-press.webp","Total Abdominal":"images/muscles/total-abdominal.webp","Lower Back":"images/muscles/lower-back.webp","Lat Machine":"images/muscles/lat-machine.webp","Run Excite séta":"images/muscles/run-excite.webp","Leg Extension":"images/muscles/leg-curl.webp","Leg Curl / Leg Extension":"images/muscles/leg-curl.webp"}},M={},LS=(()=>{try{let x=localStorage,t='__t';x.setItem(t,'1');x.removeItem(t);return x}catch{return null}})(),get=(k,d)=>{try{let v=LS?LS.getItem(k):M[k];return v==null?d:JSON.parse(v)}catch{return d}},set=(k,v)=>{try{LS?LS.setItem(k,JSON.stringify(v)):M[k]=JSON.stringify(v)}catch{M[k]=JSON.stringify(v)}};let view='Edzés',day='Hétfő',date=new Date().toISOString().slice(0,10),draft=get('v4draft',{}),hist=get('v4hist',[]),body=get('v4body',[]),prs=get('v4prs',{}),profile=get('v4profile',{height:180,rfm:''});const views=['Edzés','Naptár','Testméretek','Grafikonok','Havi statisztika','Rekordok','Előzmények','Telepítés'],today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){set('v4draft',draft);set('v4hist',hist);set('v4body',body);set('v4prs',prs);set('v4profile',profile)}function render(){document.getElementById('nav').innerHTML=views.map(x=>`<button class="${view===x?'active':''}" onclick="view='${x}';render()">${x}</button>`).join('');({Edzés:workout,Naptár:calendar,Testméretek:measure,Grafikonok:charts,'Havi statisztika':monthly,Rekordok:records,Előzmények:history,Telepítés:install}[view])()}function key(){return date+'|'+day}function cur(){return draft[key()]||(draft[key()]={date,knee:0,note:'',items:{}})}function lastFor(n){for(const h of hist){let x=h.items.find(i=>i.name===n&&i.done&&+i.weight>0);if(x)return {date:h.date,weight:+x.weight,sets:x.sets||'',reps:x.reps||''}}return null}
function workout(){let c=cur(),p=D.plans[day],done=p.filter((_,i)=>c.items[i]?.done).length,pc=Math.round(done/p.length*100);app.innerHTML=`<div class="days">${Object.keys(D.plans).map(x=>`<button class="${day===x?'active':''}" onclick="day='${x}';render()">${x}</button>`).join('')}</div><div class="card row"><button class="primary" onclick="date=today();render()">Mai edzés</button><label>Aktív dátum<input type="date" value="${date}" onchange="date=this.value;render()"></label></div><div class="card"><b>${day}: ${done}/${p.length}</b><div class="metric">${pc}%</div><div class="progress"><div class="bar" style="width:${pc}%"></div></div></div>${p.map((e,i)=>exercise(e,i,c.items[i]||{})).join('')}<div class="card"><label>Edzés megjegyzése<input value="${esc(c.note)}" onchange="cur().note=this.value;save()"></label><p><button class="primary" onclick="finish()">Edzés mentése</button> <button onclick="delete draft[key()];save();render()">Mai jelölések törlése</button></p></div>`}
function exercise(e,i,v){let[n,sets,reps,planned]=e,last=lastFor(n),w=v.weight!==undefined?v.weight:(last?last.weight:planned),knee=['Leg Curl','Leg Press','Leg Extension','Leg Curl / Leg Extension'].includes(n);return `<div class="card exercise ${v.done?'done':''}"><img class="machine" loading="lazy" decoding="async" width="105" height="108" src="${D.imgs[n]}"><img class="muscle" loading="lazy" decoding="async" width="78" height="108" src="${D.mus[n]}"><div><div class="row"><input class="check" type="checkbox" ${v.done?'checked':''} onchange="item(${i},'done',this.checked)"><h3>${n}</h3>${knee?'<span class="warning">Térd: óvatosan</span>':''}</div><div class="muted">Terv: ${sets} • ${reps} • ${planned||'próbasúly'}${n.includes('Run')?'':' kg'}</div><div class="last">${last?`Utoljára: <b>${last.date}</b> • <b>${last.weight} kg</b> • ${last.sets} × ${last.reps}`:'Még nincs korábbi mentett adat.'}</div><div class="stats"><label>Súly<input type="number" step=".5" value="${w||''}" onchange="item(${i},'weight',this.value)"></label><label>Sorozat<input value="${v.sets??sets}" onchange="item(${i},'sets',this.value)"></label><label>Ismétlés<input value="${v.reps??reps}" onchange="item(${i},'reps',this.value)"></label><label>Megjegyzés<input value="${esc(v.note||'')}" onchange="item(${i},'note',this.value)"></label></div></div></div>`}function item(i,k,v){let c=cur();c.items[i]=c.items[i]||{};c.items[i][k]=v;save();workout()}function finish(){let c=cur(),list=D.plans[day].map((e,i)=>({name:e[0],...(c.items[i]||{}),weight:c.items[i]?.weight??lastFor(e[0])?.weight??e[3]})),newpr=[];hist.unshift({date,day,knee:c.knee,note:c.note,items:list});list.forEach(x=>{if(x.name.includes('Run'))return;let w=+x.weight,o=prs[x.name]?.weight||0;if(x.done&&w>o){prs[x.name]={weight:w,reps:x.reps||'',date};newpr.push(`${x.name}: ${w} kg${o?` (+${(w-o).toFixed(1)})`:''}`)}});delete draft[key()];save();alert(newpr.length?'🏆 Új PR!\n\n'+newpr.join('\n'):'Edzés elmentve.');render()}
function mon(d){let x=new Date(d+'T12:00:00'),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function iso(x){return x.toISOString().slice(0,10)}function calendar(){let m=mon(date),a=[];for(let i=0;i<7;i++){let x=new Date(m);x.setDate(x.getDate()+i);let d=iso(x);a.push({d,h:hist.filter(y=>y.date===d)})}app.innerHTML=`<div class="card row"><button onclick="shift(-7)">Előző hét</button><button class="primary" onclick="date=today();render()">Mai hét</button><button onclick="shift(7)">Következő hét</button></div><div class="grid2">${a.map(x=>`<div class="card"><b>${x.d}</b>${x.h.map(y=>`<p>✓ ${y.day}</p>`).join('')||'<p class="muted">Nincs edzés</p>'}<button onclick="date='${x.d}';view='Edzés';render()">Megnyitás</button></div>`).join('')}</div>`}function shift(n){let x=new Date(date+'T12:00:00');x.setDate(x.getDate()+n);date=iso(x);render()}
function fat(w){if(!w||!profile.height||!profile.rfm)return null;return (profile.rfm==='m'?64:76)-20*profile.height/w}function weekAvg(d,off=0){let m=mon(d);m.setDate(m.getDate()+off*7);let z=new Date(m);z.setDate(z.getDate()+6);let a=body.filter(x=>x.date>=iso(m)&&x.date<=iso(z)&&+x.weight).map(x=>+x.weight);return a.length?a.reduce((p,q)=>p+q,0)/a.length:null}function measure(){let l=body[0]||{},c=weekAvg(date),p=weekAvg(date,-1),diff=c!=null&&p!=null?c-p:null;app.innerHTML=`<div class="card"><h2>Testméretek</h2><div class="stats"><label>Dátum<input id="md" type="date" value="${today()}"></label><label>Testsúly<input id="mw" type="number" step=".1"></label><label>Derék<input id="mc" type="number" step=".1"></label><button class="primary" onclick="addBody()">Mentés</button></div></div><div class="card"><div class="grid2"><label>Magasság cm<input type="number" value="${profile.height}" onchange="profile.height=+this.value;save();render()"></label><label>RFM képlet<select onchange="profile.rfm=this.value;save();render()"><option value="">Válassz</option><option value="m" ${profile.rfm==='m'?'selected':''}>Férfi képlet</option><option value="f" ${profile.rfm==='f'?'selected':''}>Női képlet</option></select></label></div><p class="muted">Az RFM becslés, nem orvosi mérés.</p></div><div class="grid2"><div class="card"><div class="metric">${l.weight||'-'} kg</div><b class="${diff!=null&&diff<=0?'good':'bad'}">Heti változás: ${diff==null?'nincs adat':(diff>0?'+':'')+diff.toFixed(2)+' kg'}</b></div><div class="card"><div class="metric">${fat(l.waist)==null?'RFM: -':'RFM: '+fat(l.waist).toFixed(1)+'%'}</div><div>${l.waist||'-'} cm derék</div></div></div><div class="card"><table><tr><th>Dátum</th><th>Súly</th><th>Derék</th><th>RFM</th></tr>${body.map(x=>`<tr><td>${x.date}</td><td>${x.weight}</td><td>${x.waist}</td><td>${fat(x.waist)==null?'-':fat(x.waist).toFixed(1)+'%'}</td></tr>`).join('')}</table></div>`}function addBody(){let x={date:md.value,weight:+mw.value||'',waist:+mc.value||''};if(!x.weight&&!x.waist)return;body.push(x);body.sort((a,b)=>b.date.localeCompare(a.date));save();render()}
function draw(id,key,color,transform=x=>+x[key]){let c=document.getElementById(id),q=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=[...body].map(x=>({...x,v:transform(x)})).filter(x=>Number.isFinite(x.v)).sort((a,b)=>a.date.localeCompare(b.date));c.width=w;c.height=h;if(d.length<2){q.fillText('Legalább 2 mérés szükséges.',15,30);return}let a=d.map(x=>x.v),mn=Math.min(...a),mx=Math.max(...a);if(mn===mx){mn--;mx++}q.strokeStyle=color;q.lineWidth=3;q.beginPath();d.forEach((x,i)=>{let px=35+i*(w-55)/(d.length-1),py=20+(mx-x.v)/(mx-mn)*(h-55);i?q.lineTo(px,py):q.moveTo(px,py)});q.stroke()}function charts(){app.innerHTML='<div class="grid2"><div class="card"><h3>Testsúly</h3><canvas class="chart" id="cw"></canvas></div><div class="card"><h3>Derék</h3><canvas class="chart" id="cc"></canvas></div></div><div class="card"><h3>RFM</h3><canvas class="chart" id="cf"></canvas></div>';requestAnimationFrame(()=>{draw('cw','weight','#0f766e');draw('cc','waist','#2563eb');draw('cf','rfm','#dc2626',x=>fat(x.waist))})}
function monthly(){let ym=date.slice(0,7),h=hist.filter(x=>x.date.startsWith(ym)),b=body.filter(x=>x.date.startsWith(ym)).sort((a,z)=>a.date.localeCompare(z.date)),fw=b.find(x=>+x.weight)?.weight,lw=[...b].reverse().find(x=>+x.weight)?.weight,fc=b.find(x=>+x.waist)?.waist,lc=[...b].reverse().find(x=>+x.waist)?.waist;app.innerHTML=`<div class="card"><h2>Havi statisztika</h2><input type="month" value="${ym}" onchange="date=this.value+'-01';render()"></div><div class="month"><div class="card"><b>Edzések</b><div class="metric">${h.length}</div></div><div class="card"><b>Gyakorlatok</b><div class="metric">${h.reduce((n,x)=>n+x.items.filter(y=>y.done).length,0)}</div></div><div class="card"><b>Súlyváltozás</b><div class="metric">${fw&&lw?(lw-fw).toFixed(1)+' kg':'-'}</div></div><div class="card"><b>Derékváltozás</b><div class="metric">${fc&&lc?(lc-fc).toFixed(1)+' cm':'-'}</div></div><div class="card"><b>PR-ek</b><div class="metric">${Object.values(prs).filter(x=>x.date.startsWith(ym)).length}</div></div></div>`}
function records(){app.innerHTML=`<div class="card"><h2>Személyi rekordok</h2><table><tr><th>Gép</th><th>PR</th><th>Ism.</th><th>Dátum</th></tr>${Object.entries(prs).map(([n,x])=>`<tr><td>${n}</td><td>${x.weight} kg</td><td>${x.reps}</td><td>${x.date}</td></tr>`).join('')}</table></div>`}function history(){app.innerHTML=`<div class="card"><h2>Előzmények</h2><button onclick="backup()">JSON mentés</button><button onclick="csv()">CSV export</button></div>${hist.map((h,i)=>`<div class="card"><b>${h.date} • ${h.day}</b><details><summary>Részletek</summary>${h.items.map(x=>`<p>${x.done?'✓':'-'} ${x.name}: ${x.weight||'-'} kg</p>`).join('')}</details><button class="danger" onclick="hist.splice(${i},1);save();render()">Törlés</button></div>`).join('')}`}function backup(){let a=document.createElement('a'),b=new Blob([JSON.stringify({hist,body,prs,profile},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='mark-edzesnaplo.json';a.click()}function csv(){let r=[['Dátum','Nap','Gép','Kész','Súly','Sorozat','Ismétlés']];hist.forEach(h=>h.items.forEach(x=>r.push([h.date,h.day,x.name,x.done?'igen':'nem',x.weight||'',x.sets||'',x.reps||''])));let a=document.createElement('a'),b=new Blob(['\ufeff'+r.map(x=>x.map(y=>'"'+String(y).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv'});a.href=URL.createObjectURL(b);a.download='mark-edzesnaplo.csv';a.click()}function install(){app.innerHTML='<div class="card"><img src="icons/icon-180.png" style="width:80px;border-radius:18px"><h2>iPhone telepítés</h2><ol><li>Nyisd meg GitHub Pages-en Safariban.</li><li>Megosztás.</li><li>Főképernyőhöz adás.</li></ol></div>'}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
