<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Mark Edzésnapló V6.5.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#172033;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f172a,#21445a);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.head{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head img{width:52px;height:52px;border-radius:13px}.headText{flex:1}h1{font-size:23px;margin:0}.version{font-size:11px;color:#a7f3d0}.wrap{max-width:1100px;margin:auto;padding:12px}.nav,.days,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.nav{overflow:auto;flex-wrap:nowrap;margin-bottom:10px}.nav button,.days button,button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.nav button,.days button{background:#fff;white-space:nowrap}.active,.primary{background:#0f766e!important;color:#fff}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.exercise{display:grid;grid-template-columns:105px 78px 1fr;gap:10px;scroll-margin-top:105px}.machine,.muscle{width:100%;height:108px;object-fit:contain;border-radius:11px;background:#f8fafc}.muscle{background:#fff5f5;border:1px solid #fecaca}.done{background:#ecfdf5}.done h3{text-decoration:line-through;color:#166534}.check{width:25px;height:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.muted,label{color:#64748b;font-size:13px}.metric{font-size:26px;font-weight:800}.progress{height:13px;background:#dbe4e8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#22c55e}.last{margin:7px 0;padding:7px;background:#eff6ff;border-radius:8px;font-size:12px}.warning{color:#991b1b;font-weight:700}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:16px}.danger{background:#fee2e2;color:#991b1b}.startExercise{width:100%;margin-top:10px;background:#0f766e;color:#fff;font-size:16px}.themeToggle{margin-left:auto;background:#fff}.workoutControl{text-align:center;border:2px solid #14b8a6}.workoutClock{font-size:42px;font-weight:900}.startWorkout{background:#0f766e;color:#fff}.stopWorkout{background:#b91c1c;color:#fff}#exerciseFlow{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:#020617a8}#exerciseFlow.show{display:flex}#flowPanel{width:min(370px,calc(100vw - 32px));background:#0f172a;color:#fff;border:2px solid #2dd4bf;border-radius:22px;padding:22px;text-align:center}#flowName{color:#99f6e4;font-weight:800;text-transform:uppercase}#flowSet{font-size:30px;font-weight:900;margin:12px 0}#flowClock{font-size:68px;font-weight:900}.flowTrack{height:12px;background:#334155;border-radius:20px;overflow:hidden;margin:12px 0}.flowFill{height:100%;background:#22c55e}.flowActions{display:flex;gap:8px}.flowActions button{flex:1}.flowPrimary{background:#0f766e;color:#fff}.flowDone{background:#22c55e}body.dark{background:#0b1220;color:#e5edf5}body.dark .card,body.dark .nav button,body.dark .days button{background:#172033;color:#e5edf5}body.dark input{background:#0f172a;color:#fff}body.dark .last{background:#13233a}body.dark .done{background:#123524}@media(max-width:700px){.exercise{grid-template-columns:75px 56px 1fr}.machine,.muscle{height:84px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.themeToggle{width:100%}}</style></head><body><header><div class="head"><img src="icons/icon-180.png"><div class="headText"><h1>Mark Edzésnapló</h1><div>Biostrength edzés, fejlődés és testméretek</div><div class="version">V6.5.2 • Biceps képek és Run Excite mezők</div></div><button id="themeToggle" class="themeToggle" onclick="toggleTheme()">🌙 Sötét mód</button></div></header><div class="wrap"><div class="nav" id="nav"></div><main id="app"></main></div><div id="exerciseFlow"><div id="flowPanel"><div id="flowName">Gyakorlat</div><div id="flowSet">Gyakorlat 1/3</div><div id="flowClock" style="display:none">01:00</div><div id="flowTrack" class="flowTrack" style="display:none"><div id="flowFill" class="flowFill"></div></div><div class="flowActions"><button id="flowMain" class="flowPrimary" onclick="flowMainAction()">Pihenő</button><button class="danger" onclick="closeFlow()">Bezárás</button></div></div></div><script>
const P={'Hétfő':[['Lat Machine','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Leg Curl','3','12','15'],['Run Excite séta','10-15 perc','4,5 km/h','6-7%']],'Szerda':[['Vertical Traction Biostrength Pulldown','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Leg Extension','3','12',''],['Run Excite séta','10-15 perc','4,5 km/h','6-7%']],'Péntek':[['Lat Machine','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Run Excite séta','30-32 perc','4,5 km/h','7%']]};
const paths={'Lat Machine':'lat-machine','Vertical Traction Biostrength Pulldown':'vertical-traction','Low Row':'low-row','Chest Press':'chest-press','Shoulder Press':'shoulder-press','Arm Adduction / Pectoral':'arm-adduction','Biostrength Biceps Curl':'biceps-curl','Total Abdominal':'total-abdominal','Lower Back':'lower-back','Leg Curl':'leg-curl','Leg Extension':'leg-curl','Run Excite séta':'run-excite'};const get=(k,d)=>{try{let v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let view='Edzés',day='Hétfő',date=new Date().toISOString().slice(0,10),draft=get('v4draft',{}),hist=get('v4hist',[]),prs=get('v4prs',{}),body=get('v4body',[]),flow=null,flowTimer=null,flowEnd=0,audioCtx=null,workoutTimer=null;const views=['Edzés','Testméretek','Rekordok','Előzmények','Telepítés'];function key(){return date+'|'+day}function cur(){return draft[key()]||(draft[key()]={items:{},note:''})}function save(){set('v4draft',draft);set('v4hist',hist);set('v4prs',prs);set('v4body',body)}function lastFor(n){for(const h of hist){let x=(h.items||[]).find(i=>i.name===n&&i.done&&+i.weight>0);if(x)return x}return null}function applyTheme(){let d=get('v63dark',false);document.body.classList.toggle('dark',d);themeToggle.textContent=d?'☀️ Világos mód':'🌙 Sötét mód'}function toggleTheme(){set('v63dark',!document.body.classList.contains('dark'));applyTheme()}function render(){clearInterval(workoutTimer);nav.innerHTML=views.map(x=>`<button class="${view===x?'active':''}" onclick="view='${x}';render()">${x}</button>`).join('');({Edzés:workout,Testméretek:measure,Rekordok:records,Előzmények:history,Telepítés:install}[view])();if(view==='Edzés'&&cur().workoutStart)workoutTimer=setInterval(updateClock,1000)}
function workout(){let c=cur(),p=P[day],done=p.filter((_,i)=>c.items[i]?.done).length;app.innerHTML=`<div class="days">${Object.keys(P).map(x=>`<button class="${day===x?'active':''}" onclick="day='${x}';render()">${x}</button>`).join('')}</div><div class="card"><b>${day}: ${done}/${p.length}</b><div class="metric">${Math.round(done/p.length*100)}%</div><div class="progress"><div class="bar" style="width:${done/p.length*100}%"></div></div></div>${p.map((e,i)=>exercise(e,i,c.items[i]||{})).join('')}<div class="card"><label>Edzés megjegyzése<input value="${c.note||''}" onchange="cur().note=this.value;save()"></label><p><button class="primary" onclick="finish()">Edzés mentése</button></p></div>${workoutControls(c)}`}
function exercise(e,i,v){let[n,sets,reps,planned]=e,run=n.includes('Run'),last=lastFor(n),slug=paths[n],w=v.weight!==undefined?v.weight:(last?.weight??planned);let labels=run?['Emelkedés','Sebesség','Idő','Megjegyzés']:['Súly','Sorozat','Ismétlés','Megjegyzés'];let vals=run?[v.weight??planned,v.sets??reps,v.reps??sets,v.note||'']:[w||'',v.sets??sets,v.reps??reps,v.note||''];return `<div id="exercise-${i}" class="card exercise ${v.done?'done':''}"><img class="machine" src="images/machines/${slug}.webp"><img class="muscle" src="images/muscles/${slug}.webp"><div><div class="row"><input class="check" type="checkbox" ${v.done?'checked':''} onchange="item(${i},'done',this.checked)"><h3>${n}</h3></div><div class="last">${last?`Utoljára: ${last.weight} ${run?'%':'kg'}`:'Még nincs korábbi mentett adat.'}</div><div class="stats">${labels.map((l,j)=>`<label>${l}<input ${j<3?'inputmode="decimal"':''} value="${vals[j]}" onchange="item(${i},'${['weight','sets','reps','note'][j]}',this.value)"></label>`).join('')}</div>${run?'':`<button class="startExercise" onclick="startExercise(${i},'${n.replace(/'/g,"\'")}',3)">▶ Gyakorlat indítása</button>`}</div></div>`}function item(i,k,v){let c=cur();c.items[i]=c.items[i]||{};c.items[i][k]=v;save();let y=scrollY;workout();scrollTo(0,y)}
function startExercise(i,name,total){unlockAudio();flow={i,name,total,set:1};showFlow()}function showFlow(){exerciseFlow.classList.add('show');flowName.textContent=flow.name;flowSet.textContent=`Gyakorlat ${flow.set}/${flow.total}`;flowClock.style.display='none';flowTrack.style.display='none';flowMain.style.display='';flowMain.textContent=flow.set>=flow.total?'Végeztem':'Pihenő';flowMain.className=flow.set>=flow.total?'flowDone':'flowPrimary'}function flowMainAction(){flow.set>=flow.total?completeExercise():startRest()}function startRest(){flowEnd=Date.now()+60000;flowSet.textContent='Pihenő';flowClock.style.display='block';flowTrack.style.display='block';flowMain.style.display='none';tick();clearInterval(flowTimer);flowTimer=setInterval(tick,250)}function tick(){let l=Math.max(0,Math.ceil((flowEnd-Date.now())/1000));flowClock.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');flowFill.style.width=l/60*100+'%';if(l<=0){clearInterval(flowTimer);beep();if(navigator.vibrate)navigator.vibrate(400);flow.set++;setTimeout(showFlow,400)}}function completeExercise(){let i=flow.i,c=cur();c.items[i]=c.items[i]||{};c.items[i].done=true;save();closeFlow();workout();requestAnimationFrame(()=>document.getElementById('exercise-'+(i+1))?.scrollIntoView({behavior:'smooth',block:'start'}))}function closeFlow(){clearInterval(flowTimer);exerciseFlow.classList.remove('show');flow=null}function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}}function beep(){try{unlockAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(t+.18)}catch{}}
function fmt(s){s=Math.floor(s||0);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function elapsed(){return cur().workoutStart?Math.floor((Date.now()-cur().workoutStart)/1000):0}function workoutControls(c){let r=!!c.workoutStart;return `<div class="card workoutControl"><b>${r?'Edzés folyamatban':'Edzésidő'}</b><div id="workoutClock" class="workoutClock">${fmt(elapsed())}</div><button class="${r?'stopWorkout':'startWorkout'}" onclick="${r?'stopWorkout()':'startWorkout()'}">${r?'⏹ STOP WORKOUT':'▶ START WORKOUT'}</button></div>`}function updateClock(){if(document.getElementById('workoutClock'))workoutClock.textContent=fmt(elapsed())}function startWorkout(){let y=scrollY;cur().workoutStart=Date.now();save();workout();scrollTo(0,y);workoutTimer=setInterval(updateClock,1000)}function stopWorkout(){let d=elapsed();if(confirm('Mentsem?'))finish(d);else{cur().workoutStart=null;save();workout()}}function finish(duration=null){let c=cur(),items=P[day].map((e,i)=>({name:e[0],...(c.items[i]||{}),weight:c.items[i]?.weight??e[3]}));hist.unshift({date,day,duration,items});items.forEach(x=>{if(x.done&&!x.name.includes('Run')&&+x.weight>(prs[x.name]?.weight||0))prs[x.name]={weight:+x.weight,date}});delete draft[key()];save();alert('Edzés elmentve.');render()}
function measure(){app.innerHTML=`<div class="card"><h2>Testméretek</h2><label>Testsúly<input id="mw" inputmode="decimal"></label><label>Derék<input id="mc" inputmode="decimal"></label><button onclick="body.unshift({date:new Date().toISOString().slice(0,10),weight:mw.value,waist:mc.value});save();render()">Mentés</button></div>${body.map(x=>`<div class="card">${x.date}: ${x.weight} kg • ${x.waist} cm</div>`).join('')}`}function records(){app.innerHTML='<div class="card"><h2>Rekordok</h2>'+Object.entries(prs).map(([n,x])=>`<p>${n}: ${x.weight} kg</p>`).join('')+'</div>'}function history(){app.innerHTML='<div class="card"><h2>Előzmények</h2></div>'+hist.map(h=>`<div class="card"><b>${h.date} • ${h.day}</b><p>${h.duration?fmt(h.duration):''}</p></div>`).join('')}function install(){app.innerHTML='<div class="card"><h2>iPhone telepítés</h2><ol><li>Nyisd meg Safariban.</li><li>Megosztás.</li><li>Főképernyőhöz adás.</li></ol></div>'}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=652',{updateViaCache:'none'}).then(r=>r.update());applyTheme();render();
</script></body></html>
