#exerciseFlow{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:#020617a8;backdrop-filter:blur(3px)}#exerciseFlow.show{display:flex}#flowPanel{width:min(370px,calc(100vw - 32px));background:#0f172a;color:#fff;border:2px solid #2dd4bf;border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 55px #0009}#flowName{font-size:16px;color:#99f6e4;font-weight:800;text-transform:uppercase}#flowSet{font-size:30px;font-weight:900;margin:12px 0}#flowClock{font-size:68px;font-weight:900;letter-spacing:3px;margin:8px 0}.flowTrack{height:12px;background:#334155;border-radius:20px;overflow:hidden;margin:12px 0 17px}.flowFill{height:100%;width:100%;background:#22c55e}.flowActions{display:flex;gap:8px}.flowActions button{flex:1}.flowPrimary{background:#0f766e;color:#fff}.flowDone{background:#22c55e;color:#052e16}#exerciseFlow.finished #flowPanel{background:#991b1b;border-color:#fecaca}
body.dark{background:#0b1220;color:#e5edf5}body.dark header{background:linear-gradient(135deg,#020617,#0f2a3a)}body.dark .card,body.dark .nav button,body.dark .days button{background:#172033;color:#e5edf5}body.dark .muted,body.dark label{color:#a9b7c7}body.dark input,body.dark select{background:#0f172a;color:#fff;border-color:#475569}body.dark .machine{background:#111827}body.dark .muscle{background:#231515;border-color:#7f1d1d}body.dark .last{background:#13233a;color:#dbeafe}body.dark .progress{background:#334155}body.dark .done{background:#123524}
@media(max-width:700px){.exercise{grid-template-columns:75px 56px 1fr}.machine,.muscle{height:84px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.themeToggle{width:100%}}
</style></head><body><header><div class="head"><img src="icons/icon-180.png"><div class="headText"><h1>Mark Edzésnapló</h1><div style="color:#cad5dd">Biostrength edzés, fejlődés és testméretek</div><div class="version">V6.5.1 • új edzésterv és javított gyakorlatsor</div></div><button id="themeToggle" class="themeToggle" onclick="toggleTheme()">🌙 Sötét mód</button></div></header><div class="wrap"><div class="nav" id="nav"></div><main id="app"></main></div>
<div id="exerciseFlow" role="dialog" aria-modal="true"><div id="flowPanel"><div id="flowName">Gyakorlat</div><div id="flowSet">Gyakorlat 1/3</div><div id="flowClock" style="display:none">01:00</div><div id="flowTrack" class="flowTrack" style="display:none"><div id="flowFill" class="flowFill"></div></div><div class="flowActions"><button id="flowMain" class="flowPrimary" onclick="flowMainAction()">Pihenő</button><button class="danger" onclick="closeFlow()">Bezárás</button></div></div></div>
<script>
const D={plans:{
'Hétfő':[['Lat Machine','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Leg Curl','3','12','15'],['Run Excite séta','10-15 perc','4,5 km/h','6-7%']],
'Szerda':[['Vertical Traction Biostrength Pulldown','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Leg Extension','3','12',''],['Run Excite séta','10-15 perc','4,5 km/h','6-7%']],
'Péntek':[['Lat Machine','3','10',''],['Low Row','3','10','50'],['Chest Press','3','10','45'],['Shoulder Press','3','10-12','12'],['Arm Adduction / Pectoral','3','12',''],['Biostrength Biceps Curl','3','10-12',''],['Total Abdominal','3','15-20','41'],['Lower Back','3','15','35'],['Run Excite séta','30-32 perc','4,5 km/h','7%']]},imgs:{'Lat Machine':'images/machines/lat-machine.webp','Vertical Traction Biostrength Pulldown':'images/machines/vertical-traction.webp','Low Row':'images/machines/low-row.webp','Chest Press':'images/machines/chest-press.webp','Shoulder Press':'images/machines/shoulder-press.webp','Arm Adduction / Pectoral':'images/machines/arm-adduction.webp','Biostrength Biceps Curl':'images/machines/biceps-curl.webp','Total Abdominal':'images/machines/total-abdominal.webp','Lower Back':'images/machines/lower-back.webp','Leg Curl':'images/machines/leg-curl.webp','Leg Extension':'images/machines/leg-curl.webp','Run Excite séta':'images/machines/run-excite.webp'},mus:{'Lat Machine':'images/muscles/lat-machine.webp','Vertical Traction Biostrength Pulldown':'images/muscles/vertical-traction.webp','Low Row':'images/muscles/low-row.webp','Chest Press':'images/muscles/chest-press.webp','Shoulder Press':'images/muscles/shoulder-press.webp','Arm Adduction / Pectoral':'images/muscles/arm-adduction.webp','Biostrength Biceps Curl':'images/muscles/biceps-curl.webp','Total Abdominal':'images/muscles/total-abdominal.webp','Lower Back':'images/muscles/lower-back.webp','Leg Curl':'images/muscles/leg-curl.webp','Leg Extension':'images/muscles/leg-curl.webp','Run Excite séta':'images/muscles/run-excite.webp'}};
const LS=localStorage,get=(k,d)=>{try{let v=LS.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set=(k,v)=>LS.setItem(k,JSON.stringify(v));let view='Edzés',day='Hétfő',date=new Date().toISOString().slice(0,10),draft=get('v4draft',{}),hist=get('v4hist',[]),body=get('v4body',[]),prs=get('v4prs',{}),profile=get('v4profile',{height:180,rfm:''}),flow=null,flowTimer=null,flowEnd=0,audioCtx=null,workoutTimer=null;const views=['Edzés','Naptár','Testméretek','Rekordok','Előzmények','Telepítés'],today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){set('v4draft',draft);set('v4hist',hist);set('v4body',body);set('v4prs',prs);set('v4profile',profile)}function key(){return date+'|'+day}function cur(){return draft[key()]||(draft[key()]={date,knee:0,note:'',items:{}})}function lastFor(n){for(const h of hist){let x=(h.items||[]).find(i=>i.name===n&&i.done&&+i.weight>0);if(x)return{date:h.date,weight:+x.weight,sets:x.sets||'',reps:x.reps||''}}return null}function applyTheme(){let d=get('v63dark',false);document.body.classList.toggle('dark',d);themeToggle.textContent=d?'☀️ Világos mód':'🌙 Sötét mód'}function toggleTheme(){set('v63dark',!document.body.classList.contains('dark'));applyTheme()}
function render(){clearInterval(workoutTimer);nav.innerHTML=views.map(x=>`<button class="${view===x?'active':''}" onclick="view='${x}';render()">${x}</button>`).join('');({Edzés:workout,Naptár:calendar,Testméretek:measure,Rekordok:records,Előzmények:history,Telepítés:install}[view])();if(view==='Edzés'&&cur().workoutStart)workoutTimer=setInterval(updateWorkoutClock,1000)}
function workout(){let c=cur(),p=D.plans[day],done=p.filter((_,i)=>c.items[i]?.done).length,pc=Math.round(done/p.length*100);app.innerHTML=`<div class="days">${Object.keys(D.plans).map(x=>`<button class="${day===x?'active':''}" onclick="day='${x}';render()">${x}</button>`).join('')}</div><div class="card row"><button class="primary" onclick="date=today();render()">Mai edzés</button><label>Aktív dátum<input type="date" value="${date}" onchange="date=this.value;render()"></label></div><div class="card"><b>${day}: ${done}/${p.length}</b><div class="metric">${pc}%</div><div class="progress"><div class="bar" style="width:${pc}%"></div></div></div>${p.map((e,i)=>exercise(e,i,c.items[i]||{})).join('')}<div class="card"><label>Edzés megjegyzése<input value="${esc(c.note)}" onchange="cur().note=this.value;save()"></label><p><button class="primary" onclick="finish()">Edzés mentése</button> <button onclick="delete draft[key()];save();render()">Mai jelölések törlése</button></p></div>${workoutControls(c)}`}
function exercise(e,i,v){let[n,sets,reps,planned]=e,last=lastFor(n),w=v.weight!==undefined?v.weight:(last?last.weight:planned),knee=['Leg Curl','Leg Extension'].includes(n),run=n.includes('Run');return `<div id="exercise-${i}" class="card exercise ${v.done?'done':''}"><img class="machine" src="${D.imgs[n]}" onerror="this.style.visibility='hidden'"><img class="muscle" src="${D.mus[n]}" onerror="this.style.visibility='hidden'"><div><div class="row"><input class="check" type="checkbox" ${v.done?'checked':''} onchange="item(${i},'done',this.checked)"><h3>${n}</h3>${knee?'<span class="warning">Térd: óvatosan</span>':''}</div><div class="muted">Terv: ${sets} • ${reps} • ${planned||'próbasúly'}${run?'':' kg'}</div><div class="last">${last?`Utoljára: <b>${last.date}</b> • <b>${last.weight} kg</b> • ${last.sets} × ${last.reps}`:'Még nincs korábbi mentett adat.'}</div><div class="stats"><label>Súly<input type="number" inputmode="decimal" step=".5" value="${w||''}" onchange="item(${i},'weight',this.value)"></label><label>Sorozat<input inputmode="numeric" value="${v.sets??sets}" onchange="item(${i},'sets',this.value)"></label><label>Ismétlés<input inputmode="numeric" value="${v.reps??reps}" onchange="item(${i},'reps',this.value)"></label><label>Megjegyzés<input value="${esc(v.note||'')}" onchange="item(${i},'note',this.value)"></label></div>${run?'':`<button class="startExercise" onclick="startExercise(${i},'${n.replace(/'/g,"\\'")}',${parseInt(sets)||3})">▶ Gyakorlat indítása</button>`}</div></div>`}
function item(i,k,v){let c=cur();c.items[i]=c.items[i]||{};c.items[i][k]=v;save();let y=scrollY;workout();scrollTo(0,y)}
function startExercise(i,name,total){unlockAudio();let c=cur(),v=c.items[i]||(c.items[i]={});v.activeSet=1;v.done=false;save();flow={i,name,total,set:1,mode:'exercise'};showFlow()}
function showFlow(){exerciseFlow.classList.add('show');exerciseFlow.classList.remove('finished');flowName.textContent=flow.name;flowClock.style.display='none';flowTrack.style.display='none';flowSet.textContent=`Gyakorlat ${flow.set}/${flow.total}`;flowMain.style.display='';flowMain.className=flow.set>=flow.total?'flowDone':'flowPrimary';flowMain.textContent=flow.set>=flow.total?'Végeztem':'Pihenő'}
function flowMainAction(){if(!flow)return;if(flow.set>=flow.total){completeExercise();return}startFlowRest()}
function startFlowRest(){unlockAudio();flow.mode='rest';flowEnd=Date.now()+60000;flowSet.textContent='Pihenő';flowClock.style.display='block';flowTrack.style.display='block';flowMain.style.display='none';exerciseFlow.classList.remove('finished');tickFlow();clearInterval(flowTimer);flowTimer=setInterval(tickFlow,250)}
function tickFlow(){let left=Math.max(0,Math.ceil((flowEnd-Date.now())/1000));flowClock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');flowFill.style.width=(left/60*100)+'%';if(left<=0){clearInterval(flowTimer);flowTimer=null;shortBeep();if(navigator.vibrate)navigator.vibrate(400);flow.set++;let c=cur(),v=c.items[flow.i]||(c.items[flow.i]={});v.activeSet=flow.set;save();flow.mode='exercise';exerciseFlow.classList.add('finished');setTimeout(showFlow,700)}}
function completeExercise(){let i=flow.i,c=cur(),v=c.items[i]||(c.items[i]={});v.done=true;v.activeSet=flow.total;save();closeFlow();workout();requestAnimationFrame(()=>{let next=document.getElementById('exercise-'+(i+1));if(next)next.scrollIntoView({behavior:'smooth',block:'start'})})}
function closeFlow(){clearInterval(flowTimer);flowTimer=null;exerciseFlow.classList.remove('show','finished');flow=null}
function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}function shortBeep(){try{unlockAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.18)}catch{}}
function fmtDuration(sec){sec=Math.max(0,Math.floor(sec||0));return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function elapsed(c=cur()){return c.workoutStart?Math.floor((Date.now()-c.workoutStart)/1000):(+c.workoutDuration||0)}function workoutControls(c){let r=!!c.workoutStart;return `<div class="card workoutControl"><b>${r?'Edzés folyamatban':'Edzésidő'}</b><div id="workoutClock" class="workoutClock">${fmtDuration(elapsed(c))}</div><button class="${r?'stopWorkout':'startWorkout'}" onclick="${r?'stopWorkout()':'startWorkout()'}">${r?'⏹ STOP WORKOUT':'▶ START WORKOUT'}</button></div>`}function updateWorkoutClock(){if(document.getElementById('workoutClock'))workoutClock.textContent=fmtDuration(elapsed())}function startWorkout(){let c=cur();if(c.workoutStart)return;let y=scrollY;c.workoutStart=Date.now();c.workoutDuration=0;save();workout();scrollTo(0,y);workoutTimer=setInterval(updateWorkoutClock,1000)}function stopWorkout(){let c=cur(),d=elapsed(c);if(confirm('Mentsem?')){c.workoutDuration=d;c.workoutStart=null;save();finish(d)}else{c.workoutStart=null;c.workoutDuration=0;save();workout()}}
function finish(duration=null){let c=cur(),list=D.plans[day].map((e,i)=>({name:e[0],...(c.items[i]||{}),weight:c.items[i]?.weight??lastFor(e[0])?.weight??e[3]})),newpr=[];hist.unshift({date,day,note:c.note,duration:duration??c.workoutDuration??null,items:list});list.forEach(x=>{if(x.name.includes('Run'))return;let w=+x.weight,o=prs[x.name]?.weight||0;if(x.done&&w>o){prs[x.name]={weight:w,reps:x.reps||'',date};newpr.push(`${x.name}: ${w} kg`)}});delete draft[key()];save();alert(newpr.length?'🏆 Új PR!\n'+newpr.join('\n'):'Edzés elmentve.');render()}
function calendar(){app.innerHTML='<div class="card"><h2>Naptár</h2>'+hist.slice(0,20).map(h=>`<p>✓ ${h.date} • ${h.day}</p>`).join('')+'</div>'}function measure(){app.innerHTML=`<div class="card"><h2>Testméretek</h2><div class="stats"><label>Dátum<input id="md" type="date" value="${today()}"></label><label>Testsúly<input id="mw" type="number" step=".1"></label><label>Derék<input id="mc" type="number" step=".1"></label><button class="primary" onclick="addBody()">Mentés</button></div></div><div class="card">${body.map(x=>`<p>${x.date}: ${x.weight||'-'} kg • ${x.waist||'-'} cm</p>`).join('')}</div>`}function addBody(){body.unshift({date:md.value,weight:+mw.value||'',waist:+mc.value||''});save();render()}function records(){app.innerHTML='<div class="card"><h2>Személyi rekordok</h2>'+Object.entries(prs).map(([n,x])=>`<p><b>${n}</b>: ${x.weight} kg • ${x.date}</p>`).join('')+'</div>'}function history(){app.innerHTML='<div class="card"><h2>Előzmények</h2><button onclick="backup()">JSON mentés</button><button onclick="csv()">CSV export</button></div>'+hist.map(h=>`<div class="card"><b>${h.date} • ${h.day}</b>${h.duration!=null?`<p>Edzésidő: ${fmtDuration(h.duration)}</p>`:''}<details><summary>Részletek</summary>${h.items.map(x=>`<p>${x.done?'✓':'-'} ${x.name}: ${x.weight||'-'} kg</p>`).join('')}</details></div>`).join('')}function backup(){let a=document.createElement('a'),b=new Blob([JSON.stringify({hist,body,prs,profile},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='mark-edzesnaplo.json';a.click()}function csv(){let r=[['Dátum','Nap','Gép','Kész','Súly','Sorozat','Ismétlés']];hist.forEach(h=>h.items.forEach(x=>r.push([h.date,h.day,x.name,x.done?'igen':'nem',x.weight||'',x.sets||'',x.reps||''])));let a=document.createElement('a'),b=new Blob(['\ufeff'+r.map(x=>x.join(';')).join('\r\n')],{type:'text/csv'});a.href=URL.createObjectURL(b);a.download='mark-edzesnaplo.csv';a.click()}function install(){app.innerHTML='<div class="card"><h2>iPhone telepítés</h2><ol><li>Nyisd meg Safariban.</li><li>Megosztás.</li><li>Főképernyőhöz adás.</li></ol></div>'}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=651',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});applyTheme();render();
</script></body></html>
