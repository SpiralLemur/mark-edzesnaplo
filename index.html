<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technogym Edzésnapló</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #2196f3;
      --success: #4caf50;
      --text: #ffffff;
      --text-sub: #b0b0b0;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-sub);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .progress-box {
      background: var(--card);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }
    .exercise-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .ex-header { display: flex; justify-content: space-between; align-items: center; }
    .ex-title { font-weight: bold; font-size: 1.05rem; }
    .ex-meta { color: var(--accent); font-size: 0.85rem; margin-top: 4px; }
    .ex-rest { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .sets-grid { display: flex; gap: 10px; margin-top: 10px; }
    .set-btn {
      flex: 1;
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .set-btn.done {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
      font-weight: bold;
    }
    .timer-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1f2937;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-display { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }
    .timer-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 6px;
    }
    .reset-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>🏋️‍♂️ Technogym Edzésnapló</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchDay('mon')">Hétfő (A)</button>
    <button class="tab-btn" onclick="switchDay('wed')">Szerda (B)</button>
    <button class="tab-btn" onclick="switchDay('fri')">Péntek (A+K)</button>
  </div>

  <div class="progress-box">
    <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
      <span>Elvégzett sorozatok</span>
      <span id="progress-text">0 / 0 (0%)</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="exercise-list"></div>

  <button class="reset-btn" onclick="resetDay()">Mai nap törlése / Újrakezdése</button>

  <div class="timer-bar">
    <div>
      <span style="font-size:0.8rem; color:#aaa;">Pihenőidő:</span>
      <div class="timer-display" id="timer">00:00</div>
    </div>
    <div>
      <button class="timer-btn" onclick="startTimer(60)">60s</button>
      <button class="timer-btn" onclick="startTimer(90)">90s</button>
      <button class="timer-btn" onclick="startTimer(120)">120s</button>
    </div>
  </div>

  <script>
    const workouts = {
      mon: [
        { name: "Ülő mellnyomás (Chest Press)", meta: "3 × 10 (45 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Alacsony evezés (Low Row)", meta: "3 × 10 (50 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Mellhez húzás (Lat Machine)", meta: "3 × 10 (42 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Vállnyomó gép (Shoulder Press)", meta: "3 × 10-12 (12 kg)", rest: "1,5 perc", sets: 3 },
        { name: "Térfogás / Combhajlító (Leg Curl)", meta: "3 × 10-12 (40 kg)", rest: "1 perc", sets: 3 },
        { name: "Combnyújtó gép (Leg Extension)", meta: "3 × 12-15 (15-20 kg)", rest: "1 perc", sets: 3 },
        { name: "Hátnyújtó gép (Lower Back)", meta: "3 × 12-15 (34 kg)", rest: "1 perc", sets: 3 },
        { name: "Hasprés gép (Abdominal Crunch)", meta: "3 × 12-15 (41 kg)", rest: "1 perc", sets: 3 }
      ],
      wed: [
        { name: "Combtávolító gép (Abductor)", meta: "3 × 12-15 (könnyű-közepes)", rest: "1 perc", sets: 3 },
        { name: "Mellhez húzás (Lat Machine)", meta: "3 × 10 (42 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Ülő mellnyomás (Chest Press)", meta: "3 × 10 (45 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Alacsony evezés (Low Row)", meta: "3 × 10 (50 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Vállnyomó gép (Shoulder Press)", meta: "3 × 10-12 (12 kg)", rest: "1,5 perc", sets: 3 },
        { name: "Térfogás / Combhajlító (Leg Curl)", meta: "3 × 10-12 (40 kg)", rest: "1 perc", sets: 3 },
        { name: "Hátnyújtó gép (Lower Back)", meta: "3 × 12-15 (34 kg)", rest: "1 perc", sets: 3 },
        { name: "Hasprés gép (Abdominal Crunch)", meta: "3 × 12-15 (41 kg)", rest: "1 perc", sets: 3 }
      ],
      fri: [
        { name: "Ülő mellnyomás (Chest Press)", meta: "3 × 10 (45 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Alacsony evezés (Low Row)", meta: "3 × 10 (50 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Mellhez húzás (Lat Machine)", meta: "3 × 10 (42 kg)", rest: "1,5 - 2 perc", sets: 3 },
        { name: "Vállnyomó gép (Shoulder Press)", meta: "3 × 10-12 (12 kg)", rest: "1,5 perc", sets: 3 },
        { name: "Térfogás / Combhajlító (Leg Curl)", meta: "3 × 10-12 (40 kg)", rest: "1 perc", sets: 3 },
        { name: "Combnyújtó gép (Leg Extension)", meta: "3 × 12-15 (15-20 kg)", rest: "1 perc", sets: 3 },
        { name: "Hátnyújtó gép (Lower Back)", meta: "3 × 12-15 (34 kg)", rest: "1 perc", sets: 3 },
        { name: "Hasprés gép (Abdominal Crunch)", meta: "3 × 12-15 (41 kg)", rest: "1 perc", sets: 3 },
        { name: "Futópad Kardió", meta: "35 perc | 7% emelkedő | 4.5 - 5.0 km/h", rest: "-", sets: 1 }
      ]
    };

    let currentDay = 'mon';
    let timerInterval = null;

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['mon','wed','fri'][idx] === day);
      });
      render();
    }

    function toggleSet(exIdx, setIdx) {
      const key = `workout_${currentDay}_${exIdx}_${setIdx}`;
      const state = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, !state);
      render();
    }

    function resetDay() {
      if(confirm("Biztosan törlöd a mai edzés teljesítését?")) {
        Object.keys(localStorage).forEach(key => {
          if(key.startsWith(`workout_${currentDay}_`)) {
            localStorage.removeItem(key);
          }
        });
        render();
      }
    }

    function render() {
      const container = document.getElementById('exercise-list');
      container.innerHTML = '';
      const list = workouts[currentDay];
      let totalSets = 0;
      let completedSets = 0;

      list.forEach((ex, exIdx) => {
        totalSets += ex.sets;
        const card = document.createElement('div');
        card.className = 'exercise-card';
        
        let setsHtml = '';
        for(let s = 1; s <= ex.sets; s++) {
          const isDone = localStorage.getItem(`workout_${currentDay}_${exIdx}_${s}`) === 'true';
          if(isDone) completedSets++;
          setsHtml += `<button class="set-btn ${isDone ? 'done' : ''}" onclick="toggleSet(${exIdx}, ${s})">${ex.sets === 1 ? 'Kész' : s + '. sorozat'}</button>`;
        }

        card.innerHTML = `
          <div class="ex-header">
            <div class="ex-title">${ex.name}</div>
          </div>
          <div class="ex-meta">${ex.meta}</div>
          <div class="ex-rest">⏱ Pihenő: ${ex.rest}</div>
          <div class="sets-grid">${setsHtml}</div>
        `;
        container.appendChild(card);
      });

      const pct = totalSets ? Math.round((completedSets / totalSets) * 100) : 0;
      document.getElementById('progress-text').innerText = `${completedSets} / ${totalSets} (${pct}%)`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      updateTimerDisplay(remaining);
      timerInterval = setInterval(() => {
        remaining--;
        updateTimerDisplay(remaining);
        if(remaining <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function updateTimerDisplay(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${sec}`;
    }

    render();
  </script>
</body>
</html>
